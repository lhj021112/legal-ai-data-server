services:
  - type: web
    name: legal-ai-data-server
    env: python
    rootDir: data_server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: CORS_ALLOW_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.11.9
